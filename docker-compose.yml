services:
  stats-server:
    build: stat_svc/stat_svc_service
    image: stat_svc_service
    container_name: stat_svc
    ports:
      - "9090:9090"
    depends_on:
      db:
        condition: service_healthy

    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/exploreWithMe
      - SPRING_DATASOURCE_USERNAME=exploreWithMe
      - SPRING_DATASOURCE_PASSWORD=exploreWithMe

  ewm-service:
    build: main-service
    image: main_service
    container_name: ewm-service
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
      stats-server:
        condition: service_started
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/exploreWithMe
      - SPRING_DATASOURCE_USERNAME=exploreWithMe
      - SPRING_DATASOURCE_PASSWORD=exploreWithMe
      - STATS_SERVER_URL=http://stats-server:9090

  db:
    image: postgres:16.1
    container_name: postgres
    ports:
      - "6541:5432"
    environment:
      - POSTGRES_PASSWORD=exploreWithMe
      - POSTGRES_USER=exploreWithMe
      - POSTGRES_DB=exploreWithMe
    healthcheck:
      test: pg_isready -q -d $$POSTGRES_DB -U $$POSTGRES_USER
      timeout: 5s
      interval: 5s
      retries: 10